name: Sukoonsay - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sukoonsay-production
  cancel-in-progress: false

jobs:
  build:
    name: Build all applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # ROOT ANGULAR APPLICATION
      - name: Install root dependencies
        run: npm ci

      - name: Build root Angular
        run: npm run build -- --configuration production

      # SPIRITUAL ANGULAR APPLICATION
      - name: Install Spiritual dependencies
        working-directory: Spiritual
        run: npm ci

      - name: Build Spiritual Angular
        working-directory: Spiritual
        run: npm run build -- --configuration production

      # PREPARE ALL THREE APPLICATIONS
      - name: Prepare deployment folders
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy/root
          mkdir -p deploy/spiritual
          mkdir -p deploy/phycartist

          # Root Angular application
          cp -a dist/sukoonsay/browser/. deploy/root/

          # Spiritual Angular application
          cp -a Spiritual/dist/sakoon-temple/browser/. deploy/spiritual/

          # Static HTML website
          cp -a Phycartist/. deploy/phycartist/

          # Validate deployment artifacts
          test -f deploy/root/index.html
          test -f deploy/spiritual/index.html
          test -f deploy/phycartist/index.html

          echo "All three applications are ready."

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sukoonsay-deployment
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: sukoonsay-deployment
          path: deploy/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy all three websites
        run: |
          firebase deploy \
            --only hosting:root,hosting:spiritual,hosting:phycartist \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
```
