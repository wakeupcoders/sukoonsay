name: Sukoonsay - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sukoonsay-production
  cancel-in-progress: false

jobs:
  build:
    name: Prepare all applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PREPARE ALL THREE STATIC WEBSITES
      - name: Prepare deployment folders
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy/root
          mkdir -p deploy/spiritual
          mkdir -p deploy/phycartist

          # Root static application (Sukoonsay Main)
          cp -a index.html css js assets deploy/root/
          [ -f robots.txt ] && cp -a robots.txt deploy/root/ || true
          [ -f sitemap.xml ] && cp -a sitemap.xml deploy/root/ || true
          [ -f _redirects ] && cp -a _redirects deploy/root/ || true

          # Spiritual static application (Sukoon Temple)
          cp -a Spritual/*.html Spritual/css Spritual/js Spritual/assets deploy/spiritual/
          [ -f Spritual/robots.txt ] && cp -a Spritual/robots.txt deploy/spiritual/ || true
          [ -f Spritual/sitemap.xml ] && cp -a Spritual/sitemap.xml deploy/spiritual/ || true
          [ -f Spritual/_redirects ] && cp -a Spritual/_redirects deploy/spiritual/ || true

          # Clinical Psychiatry static application (Phycartist)
          cp -a Phycartist/index.html Phycartist/css Phycartist/js Phycartist/assets deploy/phycartist/
          [ -f Phycartist/robots.txt ] && cp -a Phycartist/robots.txt deploy/phycartist/ || true
          [ -f Phycartist/sitemap.xml ] && cp -a Phycartist/sitemap.xml deploy/phycartist/ || true

          # Validate deployment artifacts
          test -f deploy/root/index.html
          test -f deploy/spiritual/index.html
          test -f deploy/phycartist/index.html

          echo "All three static applications are ready."

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sukoonsay-deployment
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: sukoonsay-deployment
          path: deploy/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy all three websites
        run: |
          firebase deploy \
            --only hosting:root,hosting:spiritual,hosting:phycartist \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
