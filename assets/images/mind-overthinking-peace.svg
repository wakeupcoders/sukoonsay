<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5EBFA"/>
      <stop offset="50%" stop-color="#F0EAF8"/>
      <stop offset="100%" stop-color="#FBE5F5"/>
    </linearGradient>
    <linearGradient id="nightPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1A47"/>
      <stop offset="50%" stop-color="#4A306D"/>
      <stop offset="100%" stop-color="#180D26"/>
    </linearGradient>
    <linearGradient id="goldAjna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B3861B"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#4A306D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#180D26" stop-opacity="0"/>
    </radialGradient>
    <filter id="thirdEyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#bgOver)"/>

  <!-- Celestial Twilight Circle (Quiet Night) -->
  <circle cx="300" cy="180" r="140" fill="url(#moonGlow)"/>
  <circle cx="300" cy="180" r="120" stroke="url(#goldAjna)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Concentric Calming Ripple Waves (Solfeggio 432 Hz Sound Waves) -->
  <circle cx="300" cy="180" r="95" stroke="url(#goldAjna)" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="180" r="70" stroke="#4A306D" stroke-width="1" opacity="0.3"/>

  <!-- Stylized Meditating Head / Crown in Silhouette -->
  <g transform="translate(300, 205)" opacity="0.85">
    <path d="M-55 70 C-55 30 -40 -10 -25 -25 C-15 -35 0 -45 0 -45 C0 -45 15 -35 25 -25 C40 -10 55 30 55 70 Z" fill="url(#nightPurple)"/>
  </g>

  <!-- Awakened Third Eye (Ajna Chakra) with Two Golden Wings / Petals -->
  <g transform="translate(300, 160)" filter="url(#thirdEyeGlow)">
    <!-- Left Ajna Petal -->
    <path d="M0 0 C-25 -20 -45 0 -45 0 C-45 0 -25 20 0 0 Z" fill="url(#goldAjna)"/>
    <!-- Right Ajna Petal -->
    <path d="M0 0 C25 -20 45 0 45 0 C45 0 25 20 0 0 Z" fill="url(#goldAjna)"/>
    <!-- Central Eye Orb -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#4A306D"/>
    <circle cx="2" cy="-2" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Golden Crescent Moon & Star of Stillness -->
  <g transform="translate(300, 85)" filter="url(#thirdEyeGlow)">
    <path d="M-15 0 A15 15 0 0 0 15 0 A12 12 0 0 1 -15 0 Z" fill="url(#goldAjna)"/>
    <circle cx="0" cy="-6" r="3.5" fill="#FFD700"/>
  </g>

  <!-- Calming Constellation Points -->
  <circle cx="200" cy="130" r="3" fill="#D4AF37"/>
  <circle cx="240" cy="90" r="2.5" fill="#D4AF37"/>
  <circle cx="360" cy="90" r="2.5" fill="#D4AF37"/>
  <circle cx="400" cy="130" r="3" fill="#D4AF37"/>
  <line x1="200" y1="130" x2="240" y2="90" stroke="url(#goldAjna)" stroke-width="0.8" opacity="0.6"/>
  <line x1="360" y1="90" x2="400" y2="130" stroke="url(#goldAjna)" stroke-width="0.8" opacity="0.6"/>

  <rect x="170" y="340" width="260" height="34" rx="17" fill="#FFFFFF" stroke="url(#goldAjna)" stroke-width="1.5"/>
  <text x="300" y="362" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2E1A47" letter-spacing="1">AJNA CHAKRA & ANXIETY STILLNESS</text>
</svg>

