<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE5F5"/>
      <stop offset="50%" stop-color="#F0EAF8"/>
      <stop offset="100%" stop-color="#E5EBFA"/>
    </linearGradient>
    <linearGradient id="goldRel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B3861B"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B81"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#4A306D"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#E65100" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2E1A47" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="20" fill="url(#bgRel)"/>
  
  <!-- Aura Circles -->
  <circle cx="300" cy="200" r="160" fill="url(#auraGlow)"/>
  <circle cx="300" cy="200" r="130" stroke="url(#goldRel)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="300" cy="200" r="100" stroke="url(#goldRel)" stroke-width="1" opacity="0.4"/>

  <!-- Sacred Kintsugi Golden Healing Threads -->
  <path d="M180 230 C220 180 260 210 300 170 C340 130 380 220 420 190" stroke="url(#goldRel)" stroke-width="3" fill="none" filter="url(#softGlow)"/>
  <path d="M210 260 C250 240 280 270 320 220 C360 170 390 250 430 220" stroke="url(#goldRel)" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Reconnected Sacred Hearts -->
  <!-- Left Heart Half -->
  <path d="M300 240 C280 200 210 160 210 210 C210 250 270 280 300 310 Z" fill="url(#heartGrad)" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Right Heart Half -->
  <path d="M300 240 C320 200 390 160 390 210 C390 250 330 280 300 310 Z" fill="url(#heartGrad)" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Anahata 12-Petal Center Lotus -->
  <g transform="translate(300, 200)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="url(#goldRel)" stroke-width="2"/>
    <!-- Lotus Petals -->
    <path d="M0 -28 C-8 -42 8 -42 0 -28" fill="url(#goldRel)"/>
    <path d="M20 -20 C30 -30 40 -16 20 -20" fill="url(#goldRel)"/>
    <path d="M28 0 C42 -8 42 8 28 0" fill="url(#goldRel)"/>
    <path d="M20 20 C30 30 40 16 20 20" fill="url(#goldRel)"/>
    <path d="M0 28 C-8 42 8 42 0 28" fill="url(#goldRel)"/>
    <path d="M-20 20 C-30 30 -40 16 -20 20" fill="url(#goldRel)"/>
    <path d="M-28 0 C-42 -8 -42 8 -28 0" fill="url(#goldRel)"/>
    <path d="M-20 -20 C-30 -30 -40 -16 -20 -20" fill="url(#goldRel)"/>
    <!-- Inner Sanskrit Om / Heart Seed (YAM) -->
    <text x="0" y="7" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" font-weight="bold" fill="#2E1A47">यं</text>
  </g>

  <!-- Radiant Golden Sparkles -->
  <circle cx="210" cy="140" r="4" fill="#D4AF37"/>
  <circle cx="390" cy="130" r="4.5" fill="#D4AF37"/>
  <circle cx="170" cy="270" r="3" fill="#D4AF37"/>
  <circle cx="430" cy="270" r="3.5" fill="#D4AF37"/>

  <!-- Badge Text -->
  <rect x="180" y="340" width="240" height="34" rx="17" fill="#FFFFFF" stroke="url(#goldRel)" stroke-width="1.5"/>
  <text x="300" y="362" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2E1A47" letter-spacing="1">ANAHATA HEART HEALING</text>
</svg>

