<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5EBFA"/>
      <stop offset="50%" stop-color="#F0EAF8"/>
      <stop offset="100%" stop-color="#FBE5F5"/>
    </linearGradient>
    <linearGradient id="divinePurpleCosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A306D"/>
      <stop offset="50%" stop-color="#2E1A47"/>
      <stop offset="100%" stop-color="#180D26"/>
    </linearGradient>
    <linearGradient id="omGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#4A306D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#180D26" stop-opacity="0"/>
    </radialGradient>
    <filter id="omShine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#bgCosmic)"/>

  <!-- Celestial Horizon & Cosmic Rings -->
  <circle cx="300" cy="180" r="145" fill="url(#portalGlow)"/>
  <circle cx="300" cy="180" r="130" stroke="url(#omGold)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="300" cy="180" r="110" stroke="url(#omGold)" stroke-width="1.2" opacity="0.4"/>
  <circle cx="300" cy="180" r="85" stroke="url(#omGold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Sacred 8-Fold Cosmic Star (Ashtalakshmi & Dharmachakra Star) -->
  <g transform="translate(300, 180)" stroke="url(#omGold)" stroke-width="1.5" fill="none" opacity="0.45">
    <rect x="-65" y="-65" width="130" height="130" rx="6"/>
    <rect x="-65" y="-65" width="130" height="130" rx="6" transform="rotate(45)"/>
  </g>

  <!-- Thousand-Petaled Sahasrara Crown Aura -->
  <g transform="translate(300, 180) scale(1.1)" filter="url(#omShine)">
    <circle cx="0" cy="0" r="50" fill="url(#divinePurpleCosmic)" stroke="url(#omGold)" stroke-width="2"/>
    <!-- Sacred Cosmic Om Symbol -->
    <text x="0" y="24" text-anchor="middle" font-family="'Cinzel', 'Noto Sans Devanagari', serif" font-size="70" font-weight="900" fill="url(#omGold)">ॐ</text>
  </g>

  <!-- Constellations & Dawn Stars of Life Direction -->
  <g filter="url(#omShine)">
    <circle cx="170" cy="110" r="3.5" fill="#FFD700"/>
    <circle cx="210" cy="80" r="2.5" fill="#FFD700"/>
    <circle cx="390" cy="80" r="2.5" fill="#FFD700"/>
    <circle cx="430" cy="110" r="3.5" fill="#FFD700"/>
    <circle cx="160" cy="240" r="2" fill="#D4AF37"/>
    <circle cx="440" cy="240" r="2" fill="#D4AF37"/>
  </g>

  <rect x="175" y="340" width="250" height="34" rx="17" fill="#FFFFFF" stroke="url(#omGold)" stroke-width="1.5"/>
  <text x="300" y="362" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2E1A47" letter-spacing="1">DHARMA & ATMA DARSHAN</text>
</svg>

