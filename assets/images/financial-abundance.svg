<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EAF8"/>
      <stop offset="50%" stop-color="#FBE5F5"/>
      <stop offset="100%" stop-color="#E5EBFA"/>
    </linearGradient>
    <linearGradient id="goldFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B3861B"/>
    </linearGradient>
    <radialGradient id="potGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A306D" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#bgFin)"/>

  <!-- Geometric Earth Square (Muladhara Root 4-Petal Foundation) -->
  <rect x="200" y="90" width="200" height="200" rx="8" fill="none" stroke="url(#goldFin)" stroke-width="2" opacity="0.4" transform="rotate(45 300 190)"/>

  <!-- Radiant Gold Circle -->
  <circle cx="300" cy="190" r="130" fill="url(#potGlow)"/>
  <circle cx="300" cy="190" r="105" stroke="url(#goldFin)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Sacred Purna Kalash (Vessel of Abundance & Security) -->
  <g transform="translate(300, 205)" filter="url(#goldShine)">
    <!-- Base Pot -->
    <ellipse cx="0" cy="40" rx="42" ry="12" fill="#B3861B"/>
    <path d="M-40 40 C-65 15 -50 -25 -25 -35 L25 -35 C50 -25 65 15 40 40 Z" fill="url(#goldFin)"/>
    <!-- Pot Neck & Rim -->
    <rect x="-28" y="-45" width="56" height="12" rx="4" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
    <!-- Mango Leaves -->
    <path d="M-22 -45 C-45 -70 -35 -95 -10 -75 Z" fill="#2ECC71" opacity="0.9"/>
    <path d="M22 -45 C45 -70 35 -95 10 -75 Z" fill="#2ECC71" opacity="0.9"/>
    <path d="M0 -45 C-15 -85 0 -110 0 -45 Z" fill="#27AE60"/>
    <!-- Sacred Coconut (Shriphal) on Top -->
    <ellipse cx="0" cy="-65" rx="22" ry="26" fill="#B3861B"/>
    <circle cx="0" cy="-65" r="16" fill="url(#goldFin)"/>
  </g>

  <!-- Cascading Golden Coins (Flow of Lakshmi Consciousness) -->
  <g filter="url(#goldShine)">
    <ellipse cx="230" cy="190" rx="16" ry="11" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
    <text x="230" y="194" text-anchor="middle" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#2E1A47">₹</text>

    <ellipse cx="370" cy="195" rx="16" ry="11" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
    <text x="370" y="199" text-anchor="middle" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#2E1A47">₹</text>

    <ellipse cx="205" cy="245" rx="14" ry="10" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
    <ellipse cx="395" cy="250" rx="14" ry="10" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>

    <ellipse cx="255" cy="285" rx="15" ry="10" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
    <ellipse cx="345" cy="290" rx="15" ry="10" fill="url(#goldFin)" stroke="#B3861B" stroke-width="1"/>
  </g>

  <rect x="170" y="340" width="260" height="34" rx="17" fill="#FFFFFF" stroke="url(#goldFin)" stroke-width="1.5"/>
  <text x="300" y="362" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2E1A47" letter-spacing="1">MULADHARA GROUNDING & ABUNDANCE</text>
</svg>

